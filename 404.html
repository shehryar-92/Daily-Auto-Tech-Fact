<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — tech-fact-bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --surface:#15181f;
    --border:#242933;
    --text:#e7e9ec;
    --text-dim:#8b93a3;
    --text-faint:#5b6273;
    --accent:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    max-width:460px;
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:40px 32px;
    text-align:center;
  }
  .code{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:16px;
  }
  h1{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:600;
    margin:0 0 12px;
  }
  p{
    font-size:14px;
    color:var(--text-dim);
    line-height:1.6;
    margin:0 0 28px;
  }
  a.back{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 22px;
    display:inline-block;
    transition:border-color 0.15s ease;
  }
  a.back:hover{border-color:var(--accent);}
  a.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
  <div class="card">
    <div class="code">error 404</div>
    <h1>fact_not_found</h1>
    <p>This page doesn't exist — but there's a real one waiting on the homepage, refreshed daily at 10:00 AM PKT.</p>
    <a class="back" href="/tech-fact-bot/">← back to today's fact</a>
  </div>
</body>
</html>
