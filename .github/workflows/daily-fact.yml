name: Daily Tech Fact

on:
  schedule:
    # 10:00 AM PKT = 05:00 UTC (PKT is UTC+5, no DST)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-fact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and log today's tech fact
        run: python fetch_fact.py

      - name: Commit and push #Commit and push the changes
        run: |
          git config user.name "shehryar-92"
          git config user.email "150334794+shehryar-92@users.noreply.github.com"
          git add facts_log.json README.md
          git diff --staged --quiet || git commit -m "docs: tech fact of the day $(date -u +'%Y-%m-%d')"
          git push
