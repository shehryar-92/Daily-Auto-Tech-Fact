<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tech-fact-bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --surface:#15181f;
    --surface-2:#1b1f28;
    --border:#242933;
    --text:#e7e9ec;
    --text-dim:#8b93a3;
    --text-faint:#5b6273;
    --accent:#2dd4bf;
    --accent-soft:rgba(45,212,191,0.12);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .eyebrow{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:28px;
  }
  .eyebrow .brand{color:var(--text-dim);}
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:11px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .dot.backup{background:var(--text-faint);box-shadow:0 0 0 3px rgba(139,147,163,0.12);}
  .dot.err{background:#c96b52;box-shadow:0 0 0 3px rgba(201,107,82,0.14);}

  h1{
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 32px;
    line-height:1.5;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
  }
  .card-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card-label .date{color:var(--text-faint);font-weight:400;letter-spacing:0.02em;}
  .fact-text{
    font-size:19px;
    line-height:1.55;
    color:var(--text);
    margin:0;
  }
  .fact-author{
    margin-top:14px;
    font-size:14px;
    color:var(--text-dim);
    font-style:italic;
  }

  .toggle-row{
    margin-top:24px;
    display:flex;justify-content:center;
  }
  .toggle-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    background:transparent;
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 18px;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .toggle-btn:hover{border-color:var(--accent);color:var(--accent);}
  .toggle-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .log{
    margin-top:20px;
    display:none;
    flex-direction:column;
    gap:1px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .log.open{display:flex;}
  .log-row{
    background:var(--surface-2);
    padding:14px 18px;
    display:grid;
    grid-template-columns:88px 16px 1fr;
    gap:14px;
    align-items:baseline;
  }
  .log-row + .log-row{border-top:1px solid var(--border);}
  .log-date{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
  }
  .log-fact{
    font-size:14px;
    line-height:1.5;
    color:var(--text-dim);
  }
  .log-empty{
    padding:20px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    background:var(--surface-2);
  }

  .error-state{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:36px 28px;
    text-align:center;
  }
  .error-state .glyph{
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    color:#c96b52;
    margin-bottom:12px;
  }
  .error-state .msg{
    font-size:15px;
    color:var(--text);
    margin-bottom:6px;
  }
  .error-state .hint{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }

  .skeleton{
    height:19px;background:var(--surface-2);border-radius:4px;
    margin-bottom:10px;overflow:hidden;position:relative;
  }
  .skeleton::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);
    animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }

  footer{
    margin-top:40px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }
  footer a{color:var(--text-faint);}
  footer a:hover{color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    .skeleton::after{animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">
      <span class="brand">tech-fact-bot</span>
      <span class="status" id="statusLine">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">syncing…</span>
      </span>
    </div>

    <h1>Fact of the day</h1>
    <p class="sub">Pulled daily from a live programming-quotes API, with a local fallback if the API is ever down.</p>

    <div id="content">
      <div class="card">
        <div class="skeleton" style="width:40%;height:11px;"></div>
        <div class="skeleton" style="width:95%;margin-top:18px;"></div>
        <div class="skeleton" style="width:80%;"></div>
        <div class="skeleton" style="width:60%;"></div>
      </div>
    </div>

    <div class="toggle-row" id="toggleRow" style="display:none;">
      <button class="toggle-btn" id="toggleBtn">view log ▾</button>
    </div>
    <div class="log" id="log"></div>

    <footer>
      <a href="https://github.com/shehryar-92" target="_blank" rel="noopener">shehryar-92</a> · updates daily at 10:00 AM PKT
    </footer>
  </div>

<script>
(async function () {
  const content = document.getElementById('content');
  const toggleRow = document.getElementById('toggleRow');
  const toggleBtn = document.getElementById('toggleBtn');
  const logEl = document.getElementById('log');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function setStatus(sourceOrErr) {
    statusDot.className = 'dot';
    if (sourceOrErr === 'error') {
      statusDot.classList.add('err');
      statusText.textContent = 'log unreachable';
    } else if (sourceOrErr === 'backup') {
      statusDot.classList.add('backup');
      statusText.textContent = 'fallback source';
    } else {
      statusText.textContent = 'live api';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderError() {
    setStatus('error');
    content.innerHTML = `
      <div class="error-state">
        <div class="glyph">[ ! ]</div>
        <div class="msg">Fact log unreachable</div>
        <div class="hint">Either the daily workflow hasn't run yet, or facts_log.json couldn't load.<br>Check back after the next scheduled run.</div>
      </div>
    `;
  }

  try {
    const res = await fetch('facts_log.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    const log = await res.json();

    if (!Array.isArray(log) || log.length === 0) {
      renderError();
      return;
    }

    const today = log[log.length - 1];
    const history = log.slice(0, -1).reverse();

    setStatus(today.source);

    content.innerHTML = `
      <div class="card">
        <div class="card-label">
          <span>fact_of_the_day</span>
          <span class="date">${escapeHtml(today.date)}</span>
        </div>
        <p class="fact-text">${escapeHtml(today.text)}</p>
        ${today.author ? `<div class="fact-author">— ${escapeHtml(today.author)}</div>` : ''}
      </div>
    `;

    if (history.length > 0) {
      toggleRow.style.display = 'flex';
      logEl.innerHTML = history.map(entry => `
        <div class="log-row">
          <span class="log-date">${escapeHtml(entry.date)}</span>
          <span class="dot ${entry.source === 'backup' ? 'backup' : ''}" style="align-self:center;"></span>
          <span class="log-fact">${escapeHtml(entry.text)}${entry.author ? ` — ${escapeHtml(entry.author)}` : ''}</span>
        </div>
      `).join('');

      toggleBtn.addEventListener('click', () => {
        const isOpen = logEl.classList.toggle('open');
        toggleBtn.textContent = isOpen ? 'hide log ▴' : 'view log ▾';
      });
    }
  } catch (err) {
    renderError();
  }
})();
</script>
</body>
</html>
